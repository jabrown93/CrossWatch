name: Release

on:
  push:
    branches:
      - main
      - beta
  # Weekly roll-up of the fix(deps) commits that .releaserc.js suppresses on
  # push, promoted into a single patch release. GitHub only fires schedule
  # from the default branch, so this sweeps main only; use the manual trigger
  # below to sweep beta.
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — weekly dependency roll-up
  # Also sets RELEASE_DEPS, so a manual run is an on-demand dependency sweep
  # (and the only way to promote beta's suppressed fix(deps) commits).
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing is gated on a human approving the `release` environment. The gate
  # is a separate job because `environment:` is not an allowed key on a job that
  # calls a reusable workflow with `uses:`, and the build/push/sign steps live
  # in jabrown93/ci, not here, so this is the only point in this repo that can
  # hold them. It runs ahead of semantic-release rather than just before image
  # push: a denied or expired approval then leaves no tag and no GitHub Release,
  # instead of stranding a tagged-but-imageless one.
  #
  # Fires on every trigger, including the Monday dependency roll-up.
  approval:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Release approved."

  release:
    needs: approval
    uses: jabrown93/ci/.github/workflows/docker-release.yml@961ef8052b3fe4906b0245c190639af19ed2073b # workflows-v2.1.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      image: ghcr.io/jabrown93/crosswatch
      # .releaserc.js's @semantic-release/exec plugin isn't in the action's
      # bundled set (commit-analyzer/release-notes-generator/changelog/git/github).
      extra-plugins: |
        @semantic-release/exec@7
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
