name: Release

on:
  push:
    branches:
      - main
      - beta
  # Weekly roll-up of the fix(deps) commits that .releaserc.js suppresses on
  # push, promoted into a single patch release. GitHub only fires schedule
  # from the default branch, so this sweeps main only; use the manual trigger
  # below to sweep beta.
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — weekly dependency roll-up
  # Also sets RELEASE_DEPS, so a manual run is an on-demand dependency sweep
  # (and the only way to promote beta's suppressed fix(deps) commits).
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jabrown93/ci/.github/workflows/docker-release.yml@b70e41bf036b757899993918c1788f38c3c472fc # workflows-v3.0.0
    permissions:
      contents: write
    with:
      # .releaserc.js's @semantic-release/exec plugin isn't in the action's
      # bundled set (commit-analyzer/release-notes-generator/changelog/git/github).
      extra-plugins: |
        @semantic-release/exec@7
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  image:
    name: Build & push image
    needs: release
    # This job MUST live here, in this repo's own workflow file -- not inside
    # another reusable workflow -- so cosign's keyless-signing Fulcio cert's
    # SAN is THIS repo's identity, not jabrown93/ci's. A composite action's
    # steps run as part of the caller's job, so the OIDC identity is this
    # repo's own workflow file/ref -- what the verify-ghcr-images Kyverno
    # policy pins to. See jabrown93/ci's actions/docker-image README.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: jabrown93/ci/actions/docker-image@3b3f9d74d9c06b48e8f7e1cc9ae8bacf927ca1b4 # docker-image-v1.0.0
        with:
          image: ghcr.io/jabrown93/crosswatch
          version: ${{ needs.release.outputs.version }}
          channel: ${{ needs.release.outputs.channel }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
