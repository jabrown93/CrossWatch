name: CI

on:
  push:
    # main/beta = post-merge run. renovate/** lets Renovate's branch-automerge
    # updates (which never open a PR) run `test` on the branch, so the
    # default-branch ruleset (required `test (3.14)` check, pull_request rule
    # dropped) can fast-forward main once the branch is green.
    branches: [main, beta, 'renovate/**']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          -r requirements-dev.txt

      - name: Run tests
        # .github/pytest-deselect.txt lists upstream tests that contradict a fork
        # decision, plus tests that already fail on the pristine upstream commit
        # in .upstream-sync. Regenerated on each sync (FORK.md).
        run: |
          args=()
          while IFS= read -r id; do
            [[ -z "${id}" || "${id}" == \#* ]] || args+=(--deselect "${id}")
          done < .github/pytest-deselect.txt
          python -m pytest "${args[@]}"
