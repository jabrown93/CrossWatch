name: dev-db-image

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crosswatch-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign attest of the CycloneDX SBOM
    steps:
      - name: Check branch
        if: github.ref_name != 'dev-db'
        run: |
          echo "Run this from the dev-db branch, got ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve dev version
        id: ver
        run: |
          set -euo pipefail

          last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "${last}" ]; then
            echo "No release tag found, leaving the version to the app fallback"
            echo "app_version=v0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${last#v}"
          version="v${major}.${minor}.$((patch + 1))-dev"

          echo "Newest tag ${last}, building as ${version}"
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev-db
            type=sha,prefix=dev-db-

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # buildx `sbom: true` above attaches SPDX -- BuildKit's SBOM attestation is
      # SPDX-only and cannot emit CycloneDX. This adds the CycloneDX half so the dev
      # image is inspectable the same way a released one is.
      #
      # syft resolves the multi-arch index to a single manifest, so this half
      # describes one architecture; the image differs by compiled arch, not packages.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        env:
          # Default `owned-by-package` emits a purl-less, license-less `type: file`
          # component per package-owned file -- pure ballast.
          SYFT_FILE_METADATA_SELECTION: none
          # Resolve licenses upstream for ecosystems shipping none in-image.
          # Best-effort: an unreachable registry degrades coverage, never fails build.
          SYFT_ENRICH: golang,javascript,python
          # `enrich: python` also drives guess-unpinned-requirements, which invents
          # versions for unpinned entries; keep it explicitly off.
          SYFT_PYTHON_GUESS_UNPINNED_REQUIREMENTS: 'false'
        with:
          # Digest, never the tag: `dev`/`dev-db` float and can move between push
          # and scan.
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attach CycloneDX SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
