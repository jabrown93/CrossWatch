name: dev-db-image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Dev version bump from the newest release tag (none keeps that version)"
        type: choice
        options: [none, patch, minor, major]
        default: none

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crosswatch-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign attest of the CycloneDX SBOM
    steps:
      - name: Check branch
        if: github.ref_name != 'dev-db'
        run: |
          echo "Run this from the dev-db branch, got ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve dev version
        id: ver
        env:
          IN_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "Newest tag: ${last:-none}"

          base="${last#v}"
          base="${base:-0.0.0}"
          IFS=. read -r major minor patch <<< "${base}"

          case "${IN_BUMP}" in
            none)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump ${IN_BUMP}"
              exit 1
              ;;
          esac

          version="v${major}.${minor}.${patch}-dev"

          echo "Building ${version} from ${last:-no release tag}"
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev-db
            type=sha,prefix=dev-db-

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # buildx `sbom: true` above attaches SPDX -- BuildKit's SBOM attestation is
      # SPDX-only and cannot emit CycloneDX. This adds the CycloneDX half so the dev
      # image is inspectable the same way a released one is.
      #
      # syft resolves the multi-arch index to a single manifest, so this half
      # describes one architecture; the image differs by compiled arch, not packages.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # Default `owned-by-package` emits a purl-less, license-less `type: file`
          # component per package-owned file -- pure ballast.
          SYFT_FILE_METADATA_SELECTION: none
          # Resolve licenses upstream for ecosystems shipping none in-image.
          # Best-effort: an unreachable registry degrades coverage, never fails build.
          SYFT_ENRICH: golang,javascript,python
          # `enrich: python` also drives guess-unpinned-requirements, which invents
          # versions for unpinned entries; keep it explicitly off.
          SYFT_PYTHON_GUESS_UNPINNED_REQUIREMENTS: 'false'
        with:
          # Digest, never the tag: `dev`/`dev-db` float and can move between push
          # and scan.
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attach CycloneDX SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
